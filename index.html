<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrnaFlow — Cloud Ready</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#182332;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:230px;background:#fff;border-right:1px solid #e1e5eb;padding:24px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{font-size:22px;font-weight:750;margin:0 10px 6px}.subbrand{font-size:11px;color:#7b8492;margin:0 10px 30px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;background:transparent;border:0;border-radius:8px;width:100%;text-align:left;padding:12px;color:#5a6370}.nav button.active{background:#eaf0fd;color:#244fa1;font-weight:650}.nav button:hover{background:#f0f3f8}.nav .ico{width:22px;text-align:center;font-size:18px}.sidefoot{position:absolute;bottom:18px;left:22px;color:#8b929d;font-size:12px}.main{flex:1;min-width:0}.topbar{height:73px;background:white;border-bottom:1px solid #e1e5eb;display:flex;align-items:center;justify-content:space-between;padding:0 32px}.topbar small{color:#707a8b}.topright{display:flex;align-items:center;gap:12px}.sync{font-size:12px;color:#28744b;background:#e8f6ed;border-radius:30px;padding:7px 10px}.avatar{width:34px;height:34px;border-radius:50%;background:#e9edf7;color:#344a88;display:grid;place-items:center;font-weight:650}.content{padding:28px 32px;max-width:1480px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}h1{font-size:25px;margin:0 0 5px}h2{font-size:17px;margin:0}p.subtitle{margin:0;color:#7a8491;font-size:13px}.btn{border:1px solid #d6dce5;background:#fff;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;color:#273347}.btn.primary{border-color:#3867c6;background:#3867c6;color:white}.btn:hover{filter:brightness(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.metric,.panel{border:1px solid #e3e7ed;border-radius:10px;background:#fff}.metric{padding:20px}.metric .label{font-size:12px;color:#788391}.metric .number{font-size:25px;font-weight:700;margin:14px 0 6px}.metric .hint{font-size:12px;color:#74808d}.panels{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}.panel{padding:20px;margin-bottom:18px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px;gap:10px}.muted{font-size:12px;color:#798493}.chip{font-size:11px;border-radius:20px;padding:5px 9px;background:#e9f4e9;color:#347245;display:inline-block}.chip.warn{background:#fff2d6;color:#996300}.chip.danger{background:#ffe8e8;color:#ae3434}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8a94a0;font-weight:650;background:#fafbfc}th,td{padding:13px 12px;border-bottom:1px solid #eef0f4}tr:last-child td{border:0}td strong{font-weight:650}td .muted{display:block;margin-top:3px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.search{border:1px solid #d8dfe8;border-radius:8px;padding:10px 12px;min-width:220px;flex:1;max-width:410px;background:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:0 0 13px}.field label{font-size:12px;color:#566273;font-weight:600}.field input,.field select{width:100%;padding:10px 11px;border:1px solid #d8dfe8;border-radius:7px;background:#fff;color:#233040}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.empty{text-align:center;padding:35px;color:#85909c}.quick{display:flex;flex-wrap:wrap;gap:10px}.notice{border:1px solid #dce7fb;background:#f0f5ff;border-radius:8px;padding:12px 14px;color:#526989;font-size:12px;margin-bottom:18px}.modalbg{display:none;align-items:center;justify-content:center;background:#15223887;position:fixed;inset:0;z-index:20;padding:16px}.modalbg.show{display:flex}.modal{width:min(520px,100%);max-height:90vh;overflow-y:auto;border-radius:12px;background:#fff;padding:24px;box-shadow:0 20px 80px #0003}.modal h2{margin-bottom:17px}.smallbtn{border:0;background:#eef3fb;color:#28549b;border-radius:6px;font-size:12px;padding:7px 9px}.toast{position:fixed;bottom:20px;right:20px;background:#24334c;color:white;border-radius:8px;padding:13px 16px;font-size:13px;z-index:50;display:none}.sale-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.item-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item-row:last-child{border:0}.summaryline{display:flex;justify-content:space-between;padding:9px 0;font-size:13px}.summaryline.total{font-size:18px;font-weight:700;border-top:1px solid #e9edf2;margin-top:10px;padding-top:17px}.qty{width:66px;padding:8px;border:1px solid #d8dfe8;border-radius:6px}select.search{max-width:none}.hintcard{font-size:12px;color:#667384;background:#f8fafc;border-radius:7px;padding:10px;line-height:1.5}@media(max-width:1080px){.cards{grid-template-columns:repeat(2,1fr)}.panels,.sale-layout{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{width:70px;padding:20px 8px}.brand{font-size:13px;margin-left:0}.subbrand,.nav .navlabel,.sidefoot{display:none}.nav button{justify-content:center}.topbar{padding:0 16px}.content{padding:18px 14px}.cards{gap:9px}.metric{padding:14px}.metric .number{font-size:19px}.grid2{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">OrnaFlow</div><div class="subbrand">Wholesale management</div><nav class="nav" id="nav"></nav><div class="sidefoot">Prototype v0.1 · Local demo</div></aside><main class="main"><header class="topbar"><div><strong id="page-label">Dashboard</strong> <small> / Overview</small></div><div class="topright"><span class="sync">● Local demo</span><span class="avatar">O</span></div></header><section class="content" id="view"></section></main></div><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='ornaflow_demo_v1';const seed={products:[{id:1,sku:'ORN-001',name:'Wooden Elephant',category:'Wooden crafts',price:850,cost:550,stock:85},{id:2,sku:'ORN-002',name:'Decorative Mask',category:'Wall decor',price:1500,cost:950,stock:12},{id:3,sku:'ORN-003',name:'Coconut Shell Bowl',category:'Coconut crafts',price:650,cost:400,stock:146},{id:4,sku:'ORN-004',name:'Handmade Jewelry Box',category:'Accessories',price:2200,cost:1450,stock:33},{id:5,sku:'ORN-005',name:'Carved Wooden Turtle',category:'Wooden crafts',price:1100,cost:700,stock:54}],customers:[{id:1,name:'Ocean View Gift Shop',phone:'077 123 4567',creditDays:30},{id:2,name:'Seaside Souvenirs',phone:'071 444 9021',creditDays:14},{id:3,name:'Heritage Crafts Store',phone:'076 229 1180',creditDays:30}],invoices:[{id:1,number:'INV-0001',customerId:1,date:'2026-11-03',total:60000,items:[],status:'posted'},{id:2,number:'INV-0002',customerId:1,date:'2026-11-07',total:25000,items:[],status:'posted'},{id:3,number:'INV-0003',customerId:2,date:'2026-11-08',total:18500,items:[],status:'posted'}],payments:[{id:1,customerId:1,amount:35000,date:'2026-11-09',note:'Opening demo payment'},{id:2,customerId:2,amount:5000,date:'2026-11-10',note:'Opening demo payment'}],movements:[]};let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed);let page='dashboard',search='',cart=[],selectedCustomer='';const fmt=n=>'Rs. '+Number(n||0).toLocaleString('en-LK',{maximumFractionDigits:2}),today=()=>new Date().toISOString().slice(0,10);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function customerName(id){return state.customers.find(c=>c.id===Number(id))?.name||'Unknown'}function due(id){return state.invoices.filter(i=>i.customerId===id).reduce((s,i)=>s+i.total,0)-state.payments.filter(p=>p.customerId===id).reduce((s,p)=>s+p.amount,0)}function totalDue(){return state.customers.reduce((s,c)=>s+due(c.id),0)}function toast(msg){let e=document.getElementById('toast');e.textContent=msg;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2600)}function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalbg').classList.add('show')}function closeModal(){document.getElementById('modalbg').classList.remove('show')};document.getElementById('modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')closeModal()});const navs=[['dashboard','▦','Dashboard'],['inventory','▣','Inventory'],['sales','▤','New Sale'],['customers','♙','Customers'],['payments','◈','Payments'],['reports','▥','Reports']];function navigate(p){page=p;search='';render()}function renderNav(){document.getElementById('nav').innerHTML=navs.map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')"><span class="ico">${icon}</span><span class="navlabel">${label}</span></button>`).join('')}function heading(t,s,buttons=''){return `<div class="heading"><div><h1>${t}</h1><p class="subtitle">${s}</p></div><div>${buttons}</div></div>`}function metric(label,number,hint){return `<div class="metric"><div class="label">${label}</div><div class="number">${number}</div><div class="hint">${hint}</div></div>`}function render(){renderNav();document.getElementById('page-label').textContent=navs.find(n=>n[0]===page)?.[2]||page;document.getElementById('view').innerHTML=({dashboard:dashboard,inventory:inventory,sales:sales,customers:customers,payments:payments,reports:reports})[page]();}function dashboard(){const inv=state.products.reduce((s,p)=>s+p.cost*p.stock,0), low=state.products.filter(p=>p.stock<=20),salesTotal=state.invoices.reduce((s,i)=>s+i.total,0);return heading('Good morning 👋','Here is your business overview.',`<button class="btn primary" onclick="navigate('sales')">+ New Sale</button>`)+`<div class="notice">Demo data is stored only in this browser. This preview does not connect to the cloud or generate official invoices.</div><div class="cards">${metric('Inventory value',fmt(inv),'At purchase cost')}${metric('Sales recorded',fmt(salesTotal),'All demo invoices')}${metric('Customer outstanding',fmt(totalDue()),'Unpaid credit sales')}${metric('Low stock products',low.length,'20 units or fewer')}</div><div class="panels"><div class="panel"><div class="panelhead"><h2>Recent invoices</h2><button class="smallbtn" onclick="navigate('customers')">View customers</button></div><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Amount</th></tr></thead><tbody>${[...state.invoices].reverse().slice(0,5).map(i=>`<tr><td><strong>${esc(i.number)}</strong><span class="muted">${esc(i.date)}</span></td><td>${esc(customerName(i.customerId))}</td><td>${fmt(i.total)}</td></tr>`).join('')||'<tr><td colspan="3">No invoices</td></tr>'}</tbody></table></div></div><div class="panel"><div class="panelhead"><h2>Quick actions</h2></div><div class="quick"><button class="btn" onclick="openProduct()">+ Add Product</button><button class="btn" onclick="openStock()">+ Receive Stock</button><button class="btn" onclick="navigate('sales')">+ Record Sale</button><button class="btn" onclick="openPayment()">+ Receive Payment</button></div><h2 style="margin-top:24px">Low stock</h2><div class="tablewrap"><table><tbody>${low.map(p=>`<tr><td>${esc(p.name)}</td><td><span class="chip warn">${p.stock} left</span></td></tr>`).join('')||'<tr><td>All products sufficiently stocked</td></tr>'}</tbody></table></div></div></div>`}function inventory(){let arr=state.products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(search.toLowerCase()));return heading('Inventory','Manage ornaments and track available stock.',`<button class="btn" onclick="openStock()">+ Receive Stock</button> <button class="btn primary" onclick="openProduct()">+ Add Product</button>`)+`<div class="panel"><div class="toolbar"><input class="search" placeholder="Search products or SKU..." value="${esc(search)}" oninput="search=this.value;updateTable('inventory')"><span class="muted">${arr.length} products</span></div><div id="inventory-results">${inventoryTable(arr)}</div></div>`}function inventoryTable(arr){return `<div class="tablewrap"><table><thead><tr><th>Product</th><th>Category</th><th>Cost</th><th>Selling price</th><th>Stock</th><th></th></tr></thead><tbody>${arr.map(p=>`<tr><td><strong>${esc(p.name)}</strong><span class="muted">${esc(p.sku)}</span></td><td>${esc(p.category)}</td><td>${fmt(p.cost)}</td><td>${fmt(p.price)}</td><td><span class="chip ${p.stock<=20?'warn':''}">${p.stock} units</span></td><td><button class="smallbtn" onclick="openStock(${p.id})">Receive</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No products found</td></tr>'}</tbody></table></div>`}function updateTable(type){if(type==='inventory')document.getElementById('inventory-results').innerHTML=inventoryTable(state.products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(search.toLowerCase())));if(type==='customers')document.getElementById('customer-results').innerHTML=customerTable(state.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(search.toLowerCase())))}function openProduct(){modal(`<h2>Add product</h2><form onsubmit="event.preventDefault();addProduct(this)"><div class="grid2"><div class="field"><label>Product name</label><input name="name" required placeholder="e.g. Wooden Elephant"></div><div class="field"><label>Product code</label><input name="sku" required placeholder="ORN-006"></div><div class="field"><label>Category</label><input name="category" required placeholder="Wooden crafts"></div><div class="field"><label>Opening stock</label><input name="stock" type="number" min="0" step="1" required value="0"></div><div class="field"><label>Purchase cost (LKR)</label><input name="cost" type="number" min="0" step="0.01" required></div><div class="field"><label>Selling price (LKR)</label><input name="price" type="number" min="0" step="0.01" required></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save product</button></div></form>`)}function addProduct(f){const a=Object.fromEntries(new FormData(f));if(state.products.some(p=>p.sku.toLowerCase()===a.sku.trim().toLowerCase()))return toast('That product code already exists');const p={id:Date.now(),name:a.name.trim(),sku:a.sku.trim(),category:a.category.trim(),stock:+a.stock,price:+a.price,cost:+a.cost};state.products.push(p);if(p.stock)state.movements.push({id:Date.now(),productId:p.id,qty:p.stock,type:'Opening stock',date:today()});save();closeModal();render();toast('Product added')}function openStock(id){modal(`<h2>Receive stock</h2><form onsubmit="event.preventDefault();receiveStock(this)"><div class="field"><label>Product</label><select name="productId" required>${state.products.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.name)} (${p.stock} available)</option>`).join('')}</select></div><div class="field"><label>Quantity received</label><input name="qty" type="number" min="1" step="1" required></div><div class="field"><label>Notes / supplier reference (optional)</label><input name="note" placeholder="Purchase reference"></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Receive stock</button></div></form>`)}function receiveStock(f){const v=Object.fromEntries(new FormData(f)),p=state.products.find(p=>p.id===+v.productId),q=+v.qty;if(!p||!Number.isInteger(q)||q<1)return toast('Invalid quantity');p.stock+=q;state.movements.push({id:Date.now(),productId:p.id,qty:q,type:'Purchase receipt',date:today(),note:v.note});save();closeModal();render();toast('Stock updated')}function customers(){return heading('Customers','Customer records and credit balances.',`<button class="btn primary" onclick="openCustomer()">+ Add Customer</button>`)+`<div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">${metric('Active customers',state.customers.length,'All registered shops')}${metric('Total outstanding',fmt(totalDue()),'Invoice balance after payments')}</div><div class="panel"><div class="toolbar"><input class="search" placeholder="Search shops or phone..." value="${esc(search)}" oninput="search=this.value;updateTable('customers')"></div><div id="customer-results">${customerTable(state.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(search.toLowerCase())))}</div></div>`}function customerTable(arr){return `<div class="tablewrap"><table><thead><tr><th>Customer / shop</th><th>Phone</th><th>Credit terms</th><th>Outstanding</th><th></th></tr></thead><tbody>${arr.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone)}</td><td>${c.creditDays} days</td><td><strong>${fmt(due(c.id))}</strong></td><td><button class="smallbtn" onclick="openPayment(${c.id})">Receive payment</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No customers found</td></tr>'}</tbody></table></div>`}function openCustomer(){modal(`<h2>Add customer</h2><form onsubmit="event.preventDefault();addCustomer(this)"><div class="field"><label>Shop name</label><input name="name" required></div><div class="field"><label>Contact number</label><input name="phone"></div><div class="field"><label>Default credit period (days)</label><input name="creditDays" type="number" min="0" value="30" required></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save customer</button></div></form>`)}function addCustomer(f){let a=Object.fromEntries(new FormData(f));state.customers.push({id:Date.now(),name:a.name.trim(),phone:a.phone,creditDays:+a.creditDays});save();closeModal();render();toast('Customer added')}function sales(){return heading('New Sale','Create a credit sale and deduct stock.',`<button class="btn" onclick="clearCart()">Clear Cart</button>`)+`<div class="sale-layout"><div class="panel"><div class="panelhead"><h2>Choose products</h2></div><div class="field"><label>Search product</label><input placeholder="Search product name / SKU" id="saleSearch" oninput="filterSaleProducts(this.value)"></div><div id="saleProducts">${saleProductList(state.products)}</div></div><div class="panel"><h2 style="margin-bottom:18px">Sale details</h2><div class="field"><label>Customer</label><select onchange="selectedCustomer=this.value" id="customerSelect"><option value="">Select customer</option>${state.customers.map(c=>`<option value="${c.id}" ${selectedCustomer===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Payment type</label><input value="Credit sale" disabled></div><div class="panelhead" style="margin-top:20px"><h2>Cart</h2><span class="muted" id="cartCount">${cart.length} products</span></div><div id="cartRows">${cartRows()}</div><div class="summaryline total"><span>Total</span><span id="saleTotal">${fmt(cartTotal())}</span></div><button class="btn primary" style="width:100%;margin-top:17px" onclick="postSale()">Confirm Credit Sale</button><p class="muted" style="line-height:1.5">Demo only: this records a local invoice and reduces stock. No official invoice PDF is issued yet.</p></div></div>`}function saleProductList(a){return a.map(p=>`<div class="item-row"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.sku)} · ${p.stock} in stock · ${fmt(p.price)}</div></div><button class="smallbtn" ${p.stock===0?'disabled':''} onclick="addCart(${p.id})">+ Add</button></div>`).join('')||'<div class="empty">No matching products</div>'}function filterSaleProducts(q){document.getElementById('saleProducts').innerHTML=saleProductList(state.products.filter(p=>(p.name+' '+p.sku).toLowerCase().includes(q.toLowerCase())))}function addCart(id){let p=state.products.find(p=>p.id===id),c=cart.find(x=>x.id===id);if(!p||((c?.qty||0)>=p.stock))return toast('Not enough stock');if(c)c.qty++;else cart.push({id,qty:1});refreshCart();toast('Added to cart')}function cartRows(){return cart.map(c=>{let p=state.products.find(p=>p.id===c.id);return `<div class="item-row"><div><strong>${esc(p.name)}</strong><div class="muted">${fmt(p.price)} × ${c.qty}</div></div><div style="display:flex;gap:5px;align-items:center"><input class="qty" type="number" min="0" max="${p.stock}" value="${c.qty}" onchange="changeQty(${c.id},this.value)"><button class="smallbtn" onclick="changeQty(${c.id},0)">×</button></div></div>`}).join('')||'<div class="empty" style="padding:16px">No products added yet</div>'}function cartTotal(){return cart.reduce((s,c)=>s+state.products.find(p=>p.id===c.id).price*c.qty,0)}function refreshCart(){if(page!=='sales')return;document.getElementById('cartRows').innerHTML=cartRows();document.getElementById('cartCount').textContent=cart.length+' products';document.getElementById('saleTotal').textContent=fmt(cartTotal())}function changeQty(id,val){const q=+val,p=state.products.find(p=>p.id===id);if(!Number.isInteger(q)||q<0||q>p.stock)return toast('Quantity exceeds available stock');if(q===0)cart=cart.filter(c=>c.id!==id);else cart.find(c=>c.id===id).qty=q;refreshCart()}function clearCart(){cart=[];refreshCart()}function postSale(){const id=+document.getElementById('customerSelect').value;selectedCustomer=String(id);if(!id)return toast('Select a customer');if(!cart.length)return toast('Add products to the cart');if(cart.some(c=>c.qty>state.products.find(p=>p.id===c.id).stock))return toast('Insufficient stock');const num='INV-'+String(Math.max(0,...state.invoices.map(i=>i.id))+1).padStart(4,'0'),invoice={id:Math.max(0,...state.invoices.map(i=>i.id))+1,number:num,customerId:id,date:today(),total:cartTotal(),status:'posted',items:cart.map(c=>({...c,price:state.products.find(p=>p.id===c.id).price}))};state.invoices.push(invoice);cart.forEach(c=>{let p=state.products.find(p=>p.id===c.id);p.stock-=c.qty;state.movements.push({id:Date.now()+Math.random(),productId:p.id,qty:-c.qty,type:'Sale',invoice:num,date:today()})});cart=[];save();render();toast(num+' saved as a local demo sale')}function payments(){return heading('Payments','Track customer payments against outstanding credit.',`<button class="btn primary" onclick="openPayment()">+ Receive Payment</button>`)+`<div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">${metric('Total received',fmt(state.payments.reduce((s,p)=>s+p.amount,0)),'All recorded payments')}${metric('Still outstanding',fmt(totalDue()),'Unpaid customer credit')}</div><div class="panel"><div class="panelhead"><h2>Payment history</h2></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Amount</th><th>Notes</th></tr></thead><tbody>${[...state.payments].reverse().map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(customerName(p.customerId))}</td><td><strong>${fmt(p.amount)}</strong></td><td>${esc(p.note||'—')}</td></tr>`).join('')}</tbody></table></div></div>`}function openPayment(id){modal(`<h2>Receive payment</h2><form onsubmit="event.preventDefault();addPayment(this)"><div class="field"><label>Customer</label><select name="customerId" required>${state.customers.map(c=>`<option value="${c.id}" ${c.id===id?'selected':''}>${esc(c.name)} · Due ${fmt(due(c.id))}</option>`).join('')}</select></div><div class="field"><label>Amount received (LKR)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Payment date</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Notes / reference</label><input name="note" placeholder="Cash / Bank transfer reference"></div><div class="hintcard">For this UI preview, payments reduce the customer-wide outstanding balance. Invoice-level payment allocation will be added to the real backend.</div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Record payment</button></div></form>`)}function addPayment(f){const a=Object.fromEntries(new FormData(f)),id=+a.customerId,amount=+a.amount;if(!Number.isFinite(amount)||amount<=0||amount>due(id))return toast('Amount must be within the outstanding balance');state.payments.push({id:Date.now(),customerId:id,amount,date:a.date,note:a.note});save();closeModal();render();toast('Payment recorded')}function reports(){return heading('Reports','Simple stock and customer summaries.')+`<div class="panels"><div class="panel"><div class="panelhead"><h2>Inventory by value</h2></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Units</th><th>Cost value</th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td><td>${fmt(p.stock*p.cost)}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><div class="panelhead"><h2>Customer receivables</h2></div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Balance</th></tr></thead><tbody>${state.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${fmt(due(c.id))}</td></tr>`).join('')}</tbody></table></div><div style="margin-top:24px"><button class="btn" onclick="exportData()">Export demo data (.json)</button> <button class="btn" onclick="resetDemo()">Reset demo</button></div></div></div>`}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ornaflow-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetDemo(){if(confirm('Reset all preview data to the original examples?')){state=structuredClone(seed);cart=[];selectedCustomer='';save();render();toast('Demo data reset')}}// OrnaFlow cloud adapter, v0.2. Supabase project URL and publishable key are browser-safe.

const CLOUD_CONFIG_KEY='ornaflow_cloud_config_v1';
const CLOUD_SESSION_KEY='ornaflow_cloud_session_v1';
const ORNAFLOW_DEFAULT_CLOUD={url:'https://infemulsjggtozskmeuh.supabase.co',key:'sb_publishable_Y50tEcIketYFK1yW-5hJAA_gayI7AZr'};
let cloudConfig=JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||'null')||ORNAFLOW_DEFAULT_CLOUD;
let cloudSession=JSON.parse(localStorage.getItem(CLOUD_SESSION_KEY)||'null');
let cloudBusy=false, cloudReady=false, cloudTimer=null, lastCloudSnapshot='';

 <div class="panel" style="max-width:750px"><h2>1. Supabase project</h2><p class="muted">Database tables have been created in your connected Supabase project. Sign up or sign in below.</p>
 <form onsubmit="event.preventDefault();configureCloud(this)">
 <div class="field"><label>Project URL</label><input required name="url" type="url" placeholder="https://your-project.supabase.co" value="${esc(config.url||'')}"></div>
 <div class="field"><label>Publishable / anon key (public)</label><input required name="key" type="text" autocomplete="off" placeholder="sb_publishable_... or eyJ..." value="${esc(config.key||'')}"></div>
 <button class="btn primary">Save connection</button></form></div>
 <div class="panel" style="max-width:750px"><h2>2. Business account</h2>
 ${!cloudConfig?'<p class="muted">Configure your project first.</p>':cloudSession?
 `<p class="muted">Signed in as <strong>${esc(cloudSession.user?.email||'account')}</strong></p>
 <div class="quick"><button class="btn primary" onclick="cloudLoad()">Refresh cloud data</button><button class="btn" onclick="cloudSignOut()">Sign out</button></div>
 <div class="panel" style="margin-top:18px;background:#fafbfc"><h2>Account security — Change password</h2><p class="muted">Update the password you use to sign in to OrnaFlow. Enter your current password to confirm it is you.</p>
 <form id="change-password-form" onsubmit="event.preventDefault();changeCloudPassword(this)">
 <div class="field"><label for="current-cloud-password">Current password</label><input id="current-cloud-password" name="current_password" type="password" autocomplete="current-password" required></div>

 <button id="change-cloud-password-button" class="btn primary" type="submit">Update password</button>
 <p class="muted" role="status" id="change-cloud-password-status" aria-live="polite" style="margin-top:10px">Use at least 12 characters. Your password is not saved in OrnaFlow records.</p></form></div>
 ${!cloudReady?`<div style="margin-top:18px"><h2>Create your business (first user only)</h2><form onsubmit="event.preventDefault();createBusiness(this)"><div class="field"><label>Business name</label><input name="name" required placeholder="e.g. Family Ornaments"></div><button class="btn primary">Create business</button></form><p class="muted">If you already belong to a business, try Refresh cloud data.</p></div>`:
 `<p class="hintcard" style="margin-top:18px">Cloud data is active. Changes made on one device are shared with the other. Refresh happens approximately every 15 seconds.</p><h2 style="margin-top:20px">Invite your second user</h2><form onsubmit="event.preventDefault();addStaff(this)"><div class="field"><label>Confirmed account email</label><input name="email" type="email" required placeholder="staff@example.com"></div><button class="btn">Add staff account</button></form><p class="muted">They must sign up and confirm their email first, without creating a separate business.</p>`
 }`:
 `<form onsubmit="event.preventDefault();cloudLogin(this)"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" minlength="6" required></div><div class="quick"><button class="btn primary" name="action" value="login">Sign in</button><button class="btn" name="action" value="signup">Create account</button></div></form><p class="muted" style="margin-top:15px">Supabase may require email confirmation after account creation.</p>`}
 </div><div class="panel" style="max-width:750px"><h2>3. Data safety</h2><p class="muted">Local demo records are NOT automatically uploaded to cloud. Cloud mode starts with an empty business database; this prevents sample records from being mistaken for real invoices. Export demo data from Reports before switching if you need a backup.</p></div>`;

function configureCloud(f){
 const v=Object.fromEntries(new FormData(f));
 let url;try{url=new URL(v.url)}catch{toast('Invalid project URL');return}
 if(url.protocol!=='https:'||!url.hostname.endsWith('.supabase.co')||url.pathname!=='/'||!v.key.trim()||v.key.toLowerCase().includes('service_role')||v.key.startsWith('sb_secret_')){toast('Enter a Supabase HTTPS project URL and PUBLIC key');return}
 cloudConfig={url:url.origin,key:v.key.trim()};localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(cloudConfig));
 cloudSession=null;localStorage.removeItem(CLOUD_SESSION_KEY);cloudReady=false;clearInterval(cloudTimer);render();toast('Connection saved. Sign in next.');
}
async function supaFetch(path,{method='GET',body,token}={}){
 if(!cloudConfig)throw Error('Configure your Supabase connection');
 const headers={'apikey':cloudConfig.key,'Content-Type':'application/json'};
 if(token)headers.Authorization='Bearer '+token;
 const response=await fetch(cloudConfig.url+path,{method,headers,...(body===undefined?{}:{body:JSON.stringify(body)})});
 let data;try{data=await response.json()}catch{data=null}
 if(!response.ok)throw Error(data?.msg||data?.error_description||data?.message||data?.error||'Cloud request failed ('+response.status+')');
 return data;
}
async function refreshSession(){
 if(!cloudSession)throw Error('Not signed in');
 if(Date.now() < cloudSession.expires_at*1000-90000)return;
 if(!cloudSession.refresh_token)throw Error('Session expired; sign in again');
 const t=await supaFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:cloudSession.refresh_token}});
 setSession(t);
}
function setSession(s){cloudSession={...s,expires_at:Math.floor(Date.now()/1000)+s.expires_in};localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(cloudSession));}
async function cloudRPC(name,args={}){await refreshSession();return supaFetch('/rest/v1/rpc/'+name,{method:'POST',token:cloudSession.access_token,body:args})}
async function cloudLogin(f){
 let a=Object.fromEntries(new FormData(f));const action=document.activeElement?.value==='signup'?'signup':'login';
 try{
  const path=action==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
  const session=await supaFetch(path,{method:'POST',body:{email:a.email,password:a.password}});
  if(!session.access_token){toast('Check your email, confirm your account, then sign in');return}
  setSession(session);render();await cloudLoad();
 }catch(e){toast(e.message)}
}
async function changeCloudPassword(form){
 const status=document.getElementById('change-cloud-password-status');
 const button=document.getElementById('change-cloud-password-button');
 if(!cloudSession?.access_token || !cloudConfig){toast('Sign in to Cloud Mode first');return}
 const current=form.elements.current_password.value;
 const next=form.elements.new_password.value;
 const confirm=form.elements.confirm_password.value;
 if(next.length<12){status.textContent='New password must have at least 12 characters.';return}
 if(next!==confirm){status.textContent='New passwords do not match.';return}
 if(next===current){status.textContent='Choose a password different from your current password.';return}
 const email=cloudSession.user?.email;
 if(!email){status.textContent='Account email unavailable. Sign out and back in, then retry.';return}
 button.disabled=true;
 status.textContent='Checking your current password…';
 try{
   // Validate the current password against Supabase Auth, not local browser state.
   const verified=await supaFetch('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password:current}});
   if(!verified.access_token)throw Error('Could not verify the current password');
   status.textContent='Updating your password…';
   await supaFetch('/auth/v1/user',{method:'PUT',token:verified.access_token,body:{password:next,current_password:current}});
   // Preserve the fresh authenticated session, never any plaintext password.
   setSession(verified);
   form.reset();
   status.textContent='Password changed successfully. Use the new password next time you sign in.';
   toast('Password updated successfully');
 }catch(error){
   status.textContent=error.message || 'Password change failed. Please try again.';
 }finally{
   button.disabled=false;
 }
}
async function cloudSignOut(){
 try{if(cloudSession?.access_token)await supaFetch('/auth/v1/logout',{method:'POST',token:cloudSession.access_token})}catch{}
 cloudSession=null;cloudReady=false;clearInterval(cloudTimer);localStorage.removeItem(CLOUD_SESSION_KEY);state=structuredClone(seed);page='cloud';render();
}
async function createBusiness(f){
 try{const name=new FormData(f).get('name');await cloudRPC('orna_create_business',{p_name:name});await cloudLoad();toast('Business created');}
 catch(e){toast(e.message)}
}
async function addStaff(f){try{await cloudRPC('orna_add_staff',{p_email:new FormData(f).get('email')});toast('Staff added to your business')}catch(e){toast(e.message)}}
async function cloudLoad(silent=false){
 if(!cloudSession)return;
 if(cloudBusy)return;
 cloudBusy=true;updateCloudBadge();
 try{
  const snap=await cloudRPC('orna_snapshot');const payload=JSON.stringify(snap);
  if(payload!==lastCloudSnapshot||!cloudReady){state=snap;lastCloudSnapshot=payload;cloudReady=true;cart=[];selectedCustomer='';if(!silent||page!=='sales')render();}
  if(!cloudTimer)cloudTimer=setInterval(()=>{if(document.visibilityState==='visible'&&cloudReady)cloudLoad(true)},15000);
 }catch(e){if(!silent){cloudReady=false;page='cloud';render();toast(e.message)}}
 finally{cloudBusy=false;updateCloudBadge()}
}
async function cloudMutate(rpc,args,success){
 if(!cloudReady){toast('Sign in to the cloud first');return}
 if(cloudBusy){toast('Please finish the current sync');return}
 cloudBusy=true;updateCloudBadge();
 try{
  const res=await cloudRPC(rpc,args);
  cloudBusy=false;
  await cloudLoad();closeModal();toast(success);return res;
 }catch(e){toast(e.message);return null}
 finally{cloudBusy=false;updateCloudBadge()}
}

postSale=async function(){
 if(!cloudReady)return localPostSale();
 const id=Number(document.getElementById('customerSelect')?.value);

 if(res)pendingPaymentOperation=null;

// Restore account session when reopening the same browser.
if(cloudConfig&&cloudSession){page='cloud';cloudLoad()}
else if(cloudConfig){page='cloud'}
