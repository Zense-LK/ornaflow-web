/* ORNAFLOW ATELIER — interface language v1
   Three material surfaces: graphite chrome / elevated ink / paper register.
   The lime accent is reserved for active paths and primary actions. */
html[data-theme="dark"]{
 --st-bg:#0c1018;--st-header:#111620;--st-elev:#1b202c;--st-elev2:#242a38;--st-line:#303747;--st-ink:#f5f7f9;--st-soft:#a0a7b6;--st-tiny:#808a9c;--st-lime:#c2ff27;--st-lime-ink:#141b0b;

}

 --st-bg:#e9ebee;--st-header:#f9fafc;--st-elev:#ffffff;--st-elev2:#f0f2f5;--st-line:#dfe2e8;--st-ink:#1c2330;--st-soft:#626c7b;--st-tiny:#86909d;--st-lime:#b2ed20;--st-lime-ink:#17200b;
 --st-paper:#ffffff;--st-paper2:#f4f5f7;--st-paper-ink:#151a22;--st-paper-soft:#727988;--st-paper-line:#e1e4e9;--st-shadow:0 14px 44px #19233310;
}

html[data-theme] body{background:var(--st-bg);color:var(--st-ink);min-width:320px}

function atelierPaid(inv){return Math.max(0,Number(inv.paid??(inv.saleType==='cash'?inv.total:0))||0)}
function atelierDue(inv){return Math.max(0,Number(inv.due??(Number(inv.total)-atelierPaid(inv)))||0)}
function atelierStatus(inv){return atelierDue(inv)===0?'Settled':atelierPaid(inv)>0?'Part paid':'Awaiting'}
function atelierDate(d){
 const date=new Date(String(d||'').slice(0,10)+'T00:00:00');
 return isNaN(date.getTime())?'—':date.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function atelierInvoicesFiltered(){

 }).sort((a,b)=>Number(b.id)-Number(a.id));
}

></form>`)}function addProduct(f){const a=Object.fromEntries(new FormData(f));if(state.products.some(p=>p.sku.toLowerCase()===a.sku.trim().toLowerCase()))return toast('That product code already exists');const p={id:Date.now(),name:a.name.trim(),sku:a.sku.trim(),category:a.category.trim(),stock:+a.stock,price:+a.price,cost:+a.cost};state.products.push(p);if(p.stock)state.movements.push({id:Date.now(),productId:p.id,qty:p.stock,type:'Opening stock',date:today()});save();closeModal();render();toast('Product added')}function openStock(id){modal(`<h2>Receive stock</h2><form onsubmit="event.preventDefault();receiveStock(this)"><div class="field"><label>Product</label><select name="productId" required>${state.products.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.name)} (${p.stock} available)</option>`).join('')}</select></div><div class="field"><label>Quantity received</label><input name="qty" type="number" min="1" step="1" required></div><div class="field"><label>Notes / supplier reference (optional)</label><input name="note" placeholder="Purchase reference"></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Receive stock</button></div></form>`)}function receiveStock(f){const v=Object.fromEntries(new FormData(f)),p=state.products.find(p=>p.id===+v.productId),q=+v.qty;if(!p||!Number.isInteger(q)||q<1)return toast('Invalid quantity');p.stock+=q;state.movements.push({id:Date.now(),productId:p.id,qty:q,type:'Purchase receipt',date:today(),note:v.note});save();closeModal();render();toast('Stock updated')}

function customerTable(arr){return `<div class="tablewrap"><table><thead><tr><th>Customer / shop</th><th>Phone</th><th>Credit terms</th><th>Outstanding</th><th></th></tr></thead><tbody>${arr.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone)}</td><td>${c.creditDays} days</td><td><strong>${fmt(due(c.id))}</strong></td><td><button class="smallbtn" onclick="openPayment(${c.id})">Receive payment</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No customers found</td></tr>'}</tbody></table></div>`}function openCustomer(){modal(`<h2>Add customer</h2><form onsubmit="event.preventDefault();addCustomer(this)"><div class="field"><label>Shop name</label><input name="name" required></div><div class="field"><label>Contact number</label><input name="phone"></div><div class="field"><label>Default credit period (days)</label><input name="creditDays" type="number" min="0" value="30" required></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save customer</button></div></form>`)}function addCustomer(f){let a=Object.fromEntries(new FormData(f));state.customers.push({id:Date.now(),name:a.name.trim(),phone:a.phone,creditDays:+a.creditDays});save();closeModal();render();toast('Customer added')}function sales(){

function refreshSalePaymentFields(){
 const label=document.getElementById('saleCustomerLabel'),select=document.getElementById('customerSelect'),paid=document.getElementById('salePaid');
 if(!paid)return;
 if(label)label.textContent=saleMode==='credit'?'Customer (required)':'Customer (optional for walk-ins)';

 paid.readOnly=saleMode==='cash';
 paid.value=saleMode==='cash'?cartTotal().toFixed(2):'0';

function refreshSaleSummary(){

 const input=document.getElementById('salePaid');
 if(!input)return;
 if(saleMode==='cash')input.value=total.toFixed(2);
 const paid=Number(input.value||0);
 const customer=Number(document.getElementById('customerSelect')?.value||0);
 const applied=customer?Math.min(total,advanceBalance(customer)):0;
 const balance=Math.max(0,total-applied-(Number.isFinite(paid)?paid:0));
 const hint=document.getElementById('customerAdvanceHint');
 if(hint)hint.textContent=applied>0?'Existing customer advance available: '+fmt(advanceBalance(customer))+' — automatically applied when confirming.':'For credit sales, an advance received now is deducted from the amount the customer owes.';
 document.getElementById('salePaidPreview').textContent=fmt(Number.isFinite(paid)?paid:0);
 document.getElementById('saleExistingAdvance').textContent=fmt(applied);
 document.getElementById('saleRemaining').textContent=fmt(balance);
}
function saleProductList(a){return a.map(p=>`<div class="item-row"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.sku)} · ${p.stock} in stock · ${fmt(p.price)}</div></div><button class="smallbtn" ${p.stock===0?'disabled':''} onclick="addCart(${p.id})">+ Add</button></div>`).join('')||'<div class="empty">No matching products</div>'}function filterSaleProducts(q){document.getElementById('saleProducts').innerHTML=saleProductList(state.products.filter(p=>(p.name+' '+p.sku).toLowerCase().includes(q.toLowerCase())))}function addCart(id){let p=state.products.find(p=>p.id===id),c=cart.find(x=>x.id===id);if(!p||((c?.qty||0)>=p.stock))return toast('Not enough stock');if(c)c.qty++;else cart.push({id,qty:1});refreshCart();toast('Added to cart')}function cartRows(){return cart.map(c=>{let p=state.products.find(p=>p.id===c.id);return `<div class="item-row"><div><strong>${esc(p.name)}</strong><div class="muted">${fmt(p.price)} × ${c.qty}</div></div><div style="display:flex;gap:5px;align-items:center"><input class="qty" type="number" min="0" max="${p.stock}" value="${c.qty}" onchange="changeQty(${c.id},this.value)"><button class="smallbtn" onclick="changeQty(${c.id},0)">×</button></div></div>`}).join('')||'<div class="empty" style="padding:16px">No products added yet</div>'}function cartTotal(){return cart.reduce((s,c)=>s+state.products.find(p=>p.id===c.id).price*c.qty,0)}function refreshCart(){if(page!=='sales')return;document.getElementById('cartRows').innerHTML=cartRows();document.getElementById('cartCount').textContent=cart.length+' products';document.getElementById('saleTotal').textContent=fmt(cartTotal());refreshSaleSummary()}function changeQty(id,val){const q=+val,p=state.products.find(p=>p.id===id);if(!Number.isInteger(q)||q<0||q>p.stock)return toast('Quantity exceeds available stock');if(q===0)cart=cart.filter(c=>c.id!==id);else cart.find(c=>c.id===id).qty=q;refreshCart()}function clearCart(){cart=[];refreshCart()}function postSale(){const id=+document.getElementById('customerSelect').value;selectedCustomer=String(id);if(!id)return toast('Select a customer');if(!cart.length)return toast('Add products to the cart');if(cart.some(c=>c.qty>state.products.find(p=>p.id===c.id).stock))return toast('Insufficient stock');const num='INV-'+String(Math.max(0,...state.invoices.map(i=>i.id))+1).padStart(4,'0'),invoice={id:Math.max(0,...state.invoices.map(i=>i.id))+1,number:num,customerId:id,date:today(),total:cartTotal(),status:'posted',items:cart.map(c=>({...c,price:state.products.find(p=>p.id===c.id).price}))};state.invoices.push(invoice);cart.forEach(c=>{let p=state.products.find(p=>p.id===c.id);p.stock-=c.qty;state.movements.push({id:Date.now()+Math.random(),productId:p.id,qty:-c.qty,type:'Sale',invoice:num,date:today()})});cart=[];save();render();toast(num+' saved as a local demo sale')}
function payments(){

function configureCloud(f){
 const v=Object.fromEntries(new FormData(f));
 let url;try{url=new URL(v.url)}catch{toast('Invalid project URL');return}
 if(url.protocol!=='https:'||!url.hostname.endsWith('.supabase.co')||url.pathname!=='/'||!v.key.trim()||v.key.toLowerCase().includes('service_role')||v.key.startsWith('sb_secret_')){toast('Enter a Supabase HTTPS project URL and PUBLIC key');return}
 cloudConfig={url:url.origin,key:v.key.trim()};localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(cloudConfig));
 cloudSession=null;localStorage.removeItem(CLOUD_SESSION_KEY);cloudReady=false;clearInterval(cloudTimer);render();toast('Connection saved. Sign in next.');
}
async function supaFetch(path,{method='GET',body,token}={}){
 if(!cloudConfig)throw Error('Configure your Supabase connection');
 const headers={'apikey':cloudConfig.key,'Content-Type':'application/json'};
 if(token)headers.Authorization='Bearer '+token;
 const response=await fetch(cloudConfig.url+path,{method,headers,...(body===undefined?{}:{body:JSON.stringify(body)})});
 let data;try{data=await response.json()}catch{data=null}
 if(!response.ok)throw Error(data?.msg||data?.error_description||data?.message||data?.error||'Cloud request failed ('+response.status+')');
 return data;
}
async function refreshSession(){
 if(!cloudSession)throw Error('Not signed in');
 if(Date.now() < cloudSession.expires_at*1000-90000)return;
 if(!cloudSession.refresh_token)throw Error('Session expired; sign in again');
 const t=await supaFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:cloudSession.refresh_token}});
 setSession(t);
}
function setSession(s){cloudSession={...s,expires_at:Math.floor(Date.now()/1000)+s.expires_in};localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(cloudSession));}
async function cloudRPC(name,args={}){await refreshSession();return supaFetch('/rest/v1/rpc/'+name,{method:'POST',token:cloudSession.access_token,body:args})}
async function cloudLogin(f){
 let a=Object.fromEntries(new FormData(f));const action=document.activeElement?.value==='signup'?'signup':'login';
 try{
  const path=action==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
  const session=await supaFetch(path,{method:'POST',body:{email:a.email,password:a.password}});
  if(!session.access_token){toast('Check your email, confirm your account, then sign in');return}
  setSession(session);render();await cloudLoad();
 }catch(e){toast(e.message)}
}
async function changeCloudPassword(form){
 const status=document.getElementById('change-cloud-password-status');
 const button=document.getElementById('change-cloud-password-button');
 if(!cloudSession?.access_token || !cloudConfig){toast('Sign in to Cloud Mode first');return}
 const current=form.elements.current_password.value;
 const next=form.elements.new_password.value;
 const confirm=form.elements.confirm_password.value;
 if(next.length<12){status.textContent='New password must have at least 12 characters.';return}
 if(next!==confirm){status.textContent='New passwords do not match.';return}
 if(next===current){status.textContent='Choose a password different from your current password.';return}
 const email=cloudSession.user?.email;
 if(!email){status.textContent='Account email unavailable. Sign out and back in, then retry.';return}
 button.disabled=true;
 status.textContent='Checking your current password…';
 try{
   // Validate the current password against Supabase Auth, not local browser state.
   const verified=await supaFetch('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password:current}});
   if(!verified.access_token)throw Error('Could not verify the current password');
   status.textContent='Updating your password…';
   await supaFetch('/auth/v1/user',{method:'PUT',token:verified.access_token,body:{password:next,current_password:current}});
   // Preserve the fresh authenticated session, never any plaintext password.
   setSession(verified);
   form.reset();
   status.textContent='Password changed successfully. Use the new password next time you sign in.';
   toast('Password updated successfully');
 }catch(error){
   status.textContent=error.message || 'Password change failed. Please try again.';
 }finally{
   button.disabled=false;
 }
}

 `<div class="notice"><strong>Correction mode:</strong> Deletes are audited: products are archived, unpaid invoices are voided with stock restored, and eligible standalone payments can be removed. Paid invoices and sale-linked payments cannot be deleted here.</div>
 <div class="panel"><div class="panelhead"><h2>Inventory · Edit products & stock</h2><span class="muted">${d.products.length} products</span></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Stock</th><th>Selling price</th><th>Action</th></tr></thead><tbody>
 ${d.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${p.stock}</td><td>${fmt(p.price)}</td><td><div class="quick"><button class="smallbtn" onclick="managementEditProduct(${p.id})">Edit</button><button class="smallbtn delete-action" onclick="managementDeleteDialog('product',${p.id})">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5">No products</td></tr>'}
 </tbody></table></div></div>
 <div class="panel"><div class="panelhead"><h2>Invoices · Correct item quantities</h2><span class="muted">${d.invoices.length} invoices</span></div><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Total</th><th>Type</th><th>Action</th></tr></thead><tbody>
 ${d.invoices.map(i=>`<tr><td>${esc(i.number)}</td><td>${esc(customerName(i.customerId))}</td><td>${fmt(i.total)}</td><td>${esc(i.saleType||'credit')}</td><td><div class="quick"><button class="smallbtn" onclick="managementEditInvoice(${i.id})">Edit lines</button><button class="smallbtn delete-action" onclick="managementDeleteDialog('invoice',${i.id})">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5">No invoices</td></tr>'}
 </tbody></table></div></div>
 <div class="panel"><div class="panelhead"><h2>Payments · Correct amounts & details</h2><span class="muted">${d.payments.length} payments</span></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Kind</th><th>Amount</th><th>Action</th></tr></thead><tbody>
 ${d.payments.map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(customerName(p.customerId))}</td><td>${esc(p.kind)}</td><td>${fmt(p.amount)}</td><td><div class="quick"><button class="smallbtn" onclick="managementEditPayment(${p.id})">Edit</button><button class="smallbtn delete-action" onclick="managementDeleteDialog('payment',${p.id})">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5">No payments</td></tr>'}
 </tbody></table></div></div>
 <div class="panel"><div class="panelhead"><h2>Change history</h2><span class="muted">Latest 100 changes</span></div><div class="tablewrap"><table><thead><tr><th>When</th><th>Editor</th><th>Record</th><th>Reason</th><th>Details</th></tr></thead><tbody>
 ${d.audit.map(a=>`<tr><td>${esc(new Date(a.when).toLocaleString('en-LK'))}</td><td><strong>${esc(a.editor)}</strong></td><td>${esc(a.entity)} #${a.entityId}</td><td>${esc(a.reason)}</td><td><button class="smallbtn" onclick="managementAuditDetails(${a.id})">Before / After</button></td></tr>`).join('')||'<tr><td colspan="5">No corrections recorded</td></tr>'}
 </tbody></table></div></div>`;
}
function managementReasonField(){return '<div class="field"><label>Reason for correction (required)</label><input name="reason" minlength="5" maxlength="500" required placeholder="E.g. Physical stock recount 17 Nov"></div>'}
function managementEditProduct(id){
 const p=managementData?.products.find(x=>x.id===id);if(!p)return;
 modal(`<h2>Edit product — ${esc(p.name)}</h2><form onsubmit="event.preventDefault();managementSaveProduct(this,${p.id})">
 <div class="grid2"><div class="field"><label>Product name</label><input name="name" value="${esc(p.name)}" required></div>
 <div class="field"><label>SKU</label><input name="sku" value="${esc(p.sku)}" required></div>
 <div class="field"><label>Category</label><input name="category" value="${esc(p.category)}"></div>
 <div class="field"><label>Stock quantity</label><input name="stock" type="number" min="0" step="1" value="${p.stock}" required></div>
 <div class="field"><label>Selling price</label><input name="price" type="number" min="0" step=".01" value="${p.price}" required></div>
 <div class="field"><label>Purchase cost</label><input name="cost" type="number" min="0" step=".01" value="${p.cost}" required></div></div>
 ${managementReasonField()}<div class="hintcard">Changing stock creates a traceable adjustment entry, not a hidden overwrite.</div>
 <div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save correction</button></div></form>`);
}
function managementEditInvoice(id){
 const i=managementData?.invoices.find(x=>x.id===id);if(!i)return;
 modal(`<h2>Correct invoice ${esc(i.number)}</h2><p class="muted">Choose a line to adjust. The invoice total and stock will be recalculated.</p>
 ${i.items.map(line=>`<div class="item-row"><div><strong>${esc(managementData.products.find(p=>p.id===line.productId)?.name||'Product #'+line.productId)}</strong><div class="muted">Qty ${line.qty} × ${fmt(line.price)}</div></div>
 <button class="smallbtn" onclick="managementEditInvoiceLine(${i.id},${line.id})">Correct quantity</button></div>`).join('')||'<p>No invoice items</p>'}
 <div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>`);
}
function managementEditInvoiceLine(id,lineId){
 const i=managementData?.invoices.find(x=>x.id===id),line=i?.items.find(x=>x.id===lineId);if(!line)return;
 modal(`<h2>Correct ${esc(i.number)} · Line #${line.id}</h2><form onsubmit="event.preventDefault();managementSaveInvoiceLine(this,${id},${lineId})">
 <div class="field"><label>Correct quantity</label><input name="qty" type="number" min="1" step="1" value="${line.qty}" required></div>
 <p class="muted">Unit price: ${fmt(line.price)}. Cash invoices cannot be changed to an unpaid balance.</p>
 ${managementReasonField()}<div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save invoice correction</button></div></form>`);
}
function managementEditPayment(id){
 const p=managementData?.payments.find(x=>x.id===id);if(!p)return;
 const fixed=p.kind==='sale_cash'||p.kind==='sale_advance';
 modal(`<h2>Edit payment #${p.id}</h2><form onsubmit="event.preventDefault();managementSavePayment(this,${p.id})">
 <div class="field"><label>Amount (LKR)</label><input name="amount" type="number" min=".01" step=".01" value="${p.amount}" ${fixed?'readonly':''} required></div>
 <div class="grid2"><div class="field"><label>Received date</label><input name="date" type="date" value="${esc(p.date)}" required></div>
 <div class="field"><label>Payment method</label><select name="method">
 ${['cash','bank','other'].map(m=>`<option value="${m}" ${p.method===m?'selected':''}>${m}</option>`).join('')}</select></div></div>
 <div class="field"><label>Note</label><input name="note" value="${esc(p.note||'')}"></div>
 ${managementReasonField()}
 <p class="muted">${fixed?'The amount of a sale-linked payment is locked; date, method and note can be corrected.':'Changing an amount recalculates the payment allocations. Excess ordinary collections are rejected.'}</p>
 <div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save payment correction</button></div></form>`);
}

function managementDeleteDialog(kind,id){
 if(!managementData||!managementPassword)return;
 const collection=kind==='product'?managementData.products:kind==='invoice'?managementData.invoices:kind==='payment'?managementData.payments:null;
 const item=collection?.find(x=>x.id===id);
 if(!item)return;
 const label=kind==='product'?item.name:kind==='invoice'?item.number:'Payment #'+id;
 const explanation=kind==='product'?'The product will be removed from active inventory. Historical sales and stock movements remain.':
 kind==='invoice'?'The invoice will be voided and stock returned. Invoices with applied payments cannot be voided here.':
 'Standalone payments can be deleted and balances recalculated. Sale-linked payments cannot be deleted separately.';
 modal(`<h2>Delete ${esc(kind)}?</h2><div class="notice">${esc(explanation)}</div>
 <p><strong>${esc(label)}</strong></p>
 <form onsubmit="event.preventDefault();managementSubmitDelete(this,'${kind}',${id})">
 <div class="field"><label>Reason for deletion (required)</label><input name="reason" required minlength="5" maxlength="500" placeholder="Why is this record being removed?"></div>
 <div class="field"><label>Type DELETE to confirm</label><input name="confirmation" required autocomplete="off" pattern="DELETE" placeholder="DELETE"></div>
 <div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn delete-danger" type="submit">Confirm deletion</button></div></form>`);
}
function managementSubmitDelete(form,kind,id){
 const a=Object.fromEntries(new FormData(form));
 if(a.confirmation!=='DELETE'){toast('Type DELETE to confirm');return}
 const actions={product:'orna_delete_product',invoice:'orna_delete_invoice',payment:'orna_delete_payment'};
 if(!actions[kind])return;
 managementMutation(actions[kind],{p_id:id,p_reason:a.reason});
}
function managementAuditDetails(id){
 const a=managementData?.audit.find(x=>x.id===id);if(!a)return;
 modal(`<h2>Audit event #${id}</h2><p class="muted">Editor: ${esc(a.editor)} · ${esc(a.reason)}</p>
 <h2 style="margin-top:20px">Before</h2><pre class="audit-json">${esc(JSON.stringify(a.before,null,2))}</pre>
 <h2 style="margin-top:20px">After</h2><pre class="audit-json">${esc(JSON.stringify(a.after,null,2))}</pre>
 <button class="btn" onclick="closeModal()">Close</button>`);
}
async function managementMutation(rpc,args){
 if(!managementPassword||managementBusy)return;
 managementBusy=true;
 try{
  await cloudRPC(rpc,{p_password:managementPassword,p_editor:managementEditor,...args});
  closeModal();
  await cloudLoad();
  await managementRefresh();
  toast('Correction saved with audit history');
 }catch(e){alert('Correction NOT saved: '+e.message)}
 finally{managementBusy=false}
}
function managementSaveProduct(form,id){
 const a=Object.fromEntries(new FormData(form));
 managementMutation('orna_edit_product',{p_id:id,p_name:a.name,p_sku:a.sku,p_category:a.category,p_price:Number(a.price),p_cost:Number(a.cost),p_stock:Number(a.stock),p_reason:a.reason});
}
function managementSaveInvoiceLine(form,id,lineId){
 const a=Object.fromEntries(new FormData(form));
 managementMutation('orna_edit_invoice_item',{p_invoice_id:id,p_line_id:lineId,p_quantity:Number(a.qty),p_reason:a.reason});
}
function managementSavePayment(form,id){
 const a=Object.fromEntries(new FormData(form));
 managementMutation('orna_edit_payment',{p_payment_id:id,p_amount:Number(a.amount),p_date:a.date,p_method:a.method,p_note:a.note,p_reason:a.reason});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&managementPassword){managementLock(page==='management');}});

// Restore account session when reopening the same browser.
if(cloudConfig&&cloudSession){page='cloud';cloudLoad()}
else if(cloudConfig){page='cloud'}

render();
</script></body></html>
