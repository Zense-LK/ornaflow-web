</style></head><body><div class="app"><aside class="sidebar"><div class="brand">OrnaFlow</div><div class="subbrand">Wholesale management</div><nav class="nav" id="nav"></nav><div class="sidefoot">Prototype v0.1 · Local demo</div></aside><main class="main"><header class="topbar"><div><strong id="page-label">Dashboard</strong> <small> / Overview</small></div><div class="topright"><button class="theme-toggle" id="theme-toggle" type="button" onclick="toggleOrnaTheme()" aria-label="Switch to dark mode" aria-pressed="false" title="Switch theme"><span class="theme-glyph" aria-hidden="true">☾</span><span class="theme-label">Dark mode</span></button><span class="sync">● Local demo</span><span class="avatar">O</span></div></header><section class="content" id="view"></section></main></div><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const ORNA_THEME_KEY='ornaflow-theme-v1';
function updateOrnaThemeControl(){
 const button=document.getElementById('theme-toggle');
 if(!button)return;
 const dark=document.documentElement.dataset.theme==='dark';
 button.setAttribute('aria-pressed',String(dark));
 button.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');
 button.title=dark?'Switch to light mode':'Switch to dark mode';
 const glyph=button.querySelector('.theme-glyph');
 const label=button.querySelector('.theme-label');
 if(glyph)glyph.textContent=dark?'☀':'☾';
 if(label)label.textContent=dark?'Light mode':'Dark mode';

function toggleOrnaTheme(){
 const dark=document.documentElement.dataset.theme==='dark';
 const target=dark?'light':'dark';
 document.documentElement.dataset.theme=target;
 document.documentElement.style.colorScheme=target;
 try{localStorage.setItem(ORNA_THEME_KEY,target)}catch(e){}
 updateOrnaThemeControl();
}
updateOrnaThemeControl();
const KEY='ornaflow_demo_v1';const seed={products:[{id:1,sku:'ORN-001',name:'Wooden Elephant',category:'Wooden crafts',price:850,cost:550,stock:85},{id:2,sku:'ORN-002',name:'Decorative Mask',category:'Wall decor',price:1500,cost:950,stock:12},{id:3,sku:'ORN-003',name:'Coconut Shell Bowl',category:'Coconut crafts',price:650,cost:400,stock:146},{id:4,sku:'ORN-004',name:'Handmade Jewelry Box',category:'Accessories',price:2200,cost:1450,stock:33},{id:5,sku:'ORN-005',name:'Carved Wooden Turtle',category:'Wooden crafts',price:1100,cost:700,stock:54}],customers:[{id:1,name:'Ocean View Gift Shop',phone:'077 123 4567',creditDays:30},{id:2,name:'Seaside Souvenirs',phone:'071 444 9021',creditDays:14},{id:3,name:'Heritage Crafts Store',phone:'076 229 1180',creditDays:30}],invoices:[{id:1,number:'INV-0001',customerId:1,date:'2026-11-03',total:60000,items:[],status:'posted'},{id:2,number:'INV-0002',customerId:1,date:'2026-11-07',total:25000,items:[],status:'posted'},{id:3,number:'INV-0003',customerId:2,date:'2026-11-08',total:18500,items:[],status:'posted'}],payments:[{id:1,customerId:1,amount:35000,date:'2026-11-09',note:'Opening demo payment'},{id:2,customerId:2,amount:5000,date:'2026-11-10',note:'Opening demo payment'}],movements:[]};let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed);let page='dashboard',search='',cart=[],selectedCustomer='',saleMode='credit';const fmt=n=>'Rs. '+Number(n||0).toLocaleString('en-LK',{maximumFractionDigits:2}),today=()=>new Date().toISOString().slice(0,10);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function customerName(id){return state.customers.find(c=>c.id===Number(id))?.name||'Unknown'}function netDue(id){return state.invoices.filter(i=>i.customerId===id).reduce((s,i)=>s+Number(i.total),0)-state.payments.filter(p=>p.customerId===id).reduce((s,p)=>s+Number(p.amount),0)}function due(id){return Math.max(0,netDue(id))}function advanceBalance(id){return Math.max(0,-netDue(id))}function totalDue(){return state.customers.reduce((s,c)=>s+due(c.id),0)}function toast(msg){let e=document.getElementById('toast');e.textContent=msg;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2600)}function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalbg').classList.add('show')}function closeModal(){document.getElementById('modalbg').classList.remove('show')};document.getElementById('modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')closeModal()});const navs=[['dashboard','▦','Dashboard'],['inventory','▣','Inventory'],['sales','▤','New Sale'],['customers','♙','Customers'],['payments','◈','Payments'],['reports','▥','Reports']];function navigate(p){page=p;search='';render()}function renderNav(){document.getElementById('nav').innerHTML=navs.map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')"><span class="ico">${icon}</span><span class="navlabel">${label}</span></button>`).join('')}function heading(t,s,buttons=''){return `<div class="heading"><div><h1>${t}</h1><p class="subtitle">${s}</p></div><div>${buttons}</div></div>`}function metric(label,number,hint){return `<div class="metric"><div class="label">${label}</div><div class="number">${number}</div><div class="hint">${hint}</div></div>`}function render(){renderNav();document.getElementById('page-label').textContent=navs.find(n=>n[0]===page)?.[2]||page;document.getElementById('view').innerHTML=({dashboard:dashboard,inventory:inventory,sales:sales,customers:customers,payments:payments,reports:reports})[page]();if(page==='sales')refreshSaleSummary();}function dashboard(){
 const inv=state.products.reduce((sum,p)=>sum+p.cost*p.stock,0);
 const low=state.products.filter(p=>p.stock<=20);
 const salesTotal=state.invoices.reduce((sum,i)=>sum+i.total,0);
 const received=state.payments.reduce((sum,p)=>sum+p.amount,0);
 const dueTotal=totalDue();
 const now=new Date();
 const greeting=now.getHours()<12?'Good morning':now.getHours()<17?'Good afternoon':'Good evening';
 const day=now.toLocaleDateString('en-LK',{weekday:'long',month:'long',day:'numeric'});
 const latest=[...state.invoices].reverse().slice(0,4);
 const statusText=typeof cloudReady!=='undefined'&&cloudReady?'CLOUD CONNECTED':'LOCAL PREVIEW';
 const creditPercent=salesTotal>0?Math.min(100,Math.max(0,Math.round(received/salesTotal*100))):0;
 const maxStock=Math.max(1,...state.products.map(p=>p.stock));
 const chartRows=state.products.slice().sort((x,y)=>y.stock-x.stock).slice(0,5);
 return `<div class="dash-head"><div><div class="eyebrow">${esc(day)} · ORNAFLOW / OVERVIEW</div><h1>${greeting}<span class="accent-dot">.</span></h1><p class="subtitle">A clearer view of your wholesale business.</p></div><button class="btn primary" onclick="navigate('sales')"><span aria-hidden="true">＋</span> New sale <span aria-hidden="true">↗</span></button></div>
 ${!cloudReady?'<div class="notice" role="alert"><strong>Cloud not connected:</strong> the figures below are sample preview data, not your business records. Open <a href="#" onclick="event.preventDefault();navigate(\'cloud\')">Cloud Setup</a> and sign in. Saving stock, sales and payments is disabled until the connection is ready.</div>':''}<div class="bento-grid">
  <article class="bento-card hero-card"><div class="card-top"><span class="tile-label">TOTAL STOCK VALUE</span><span class="tile-icon">↗</span></div><div><div class="hero-number">${fmt(inv)}</div><p>Current inventory at purchase cost</p></div><div class="hero-bottom"><span class="hero-pill">● ${state.products.length} products tracked</span><span class="hero-graphic" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></div></article>
  <article class="bento-card light-card"><div class="card-top"><span class="tile-label">CREDIT OUTSTANDING</span><span class="tile-icon">↗</span></div><div><div class="tile-number">${fmt(dueTotal)}</div><p>To collect from customers</p></div><div class="progress-track"><span style="width:${creditPercent}%"></span></div><div class="tile-bottom"><span>Collected ${creditPercent}% of billed total</span><span>↗</span></div></article>
  <article class="bento-card vivid-card"><div class="card-top"><span class="tile-label">SALES RECORDED</span><span class="tile-icon">↗</span></div><div><div class="tile-number">${fmt(salesTotal)}</div><p>Total invoiced to date</p></div><span class="bubble-info">${state.invoices.length} invoices</span></article>
  <article class="bento-card white-card"><div class="card-top"><span class="tile-label">CUSTOMERS</span><span class="tile-icon">◎</span></div><div><div class="tile-number">${state.customers.length}</div><p>Wholesale shop accounts</p></div><button class="text-action" onclick="navigate('customers')">View customer list <span>↗</span></button></article>
  <article class="bento-card dark-card"><div class="card-top"><span class="tile-label">LOW STOCK ALERTS</span><span class="tile-icon">↗</span></div><div><div class="tile-number">${low.length.toString().padStart(2,'0')}</div><p>Products with 20 units or fewer</p></div><div class="status-strip"><span class="status-led"></span>${low.length?'Stock replenishment recommended':'All products stocked'}</div></article>
  <article class="bento-card chart-card"><div class="card-top"><span class="tile-label">STOCK SNAPSHOT</span><span class="tile-icon">▥</span></div><div class="mini-bars">${chartRows.length?chartRows.map((p,i)=>`<div class="bar-row"><span title="${esc(p.name)}">${esc(p.name)}</span><div class="bar-track"><i style="width:${Math.max(4,p.stock/maxStock*100)}%;background:${i===0?'#daff29':i===1?'#a8c8ff':i===2?'#ffa791':'#dedee3'}"></i></div><strong>${p.stock}</strong></div>`).join(''):'<p class="muted">No stock has been added yet.</p>'}</div></article>
  <article class="bento-card actions-card"><div class="card-top"><span class="tile-label">QUICK ACTIONS</span><span class="tile-icon">✳</span></div><div class="action-grid"><button onclick="openProduct()"><span>＋</span><strong>Add product</strong><small>Expand catalog</small></button><button onclick="openStock()"><span>↧</span><strong>Receive stock</strong><small>Update quantities</small></button><button onclick="navigate('sales')"><span>↗</span><strong>New sale</strong><small>Create credit sale</small></button><button onclick="openPayment()"><span>◉</span><strong>Payment</strong><small>Record collection</small></button></div></article>
  <article class="bento-card recent-card"><div class="card-top"><span class="tile-label">RECENT INVOICES</span><span class="tile-icon">↗</span></div><div class="recent-items">${latest.length?latest.map(i=>`<div class="recent-item"><div class="recent-monogram">↗</div><div class="recent-copy"><strong>${esc(customerName(i.customerId))}</strong><small>${esc(i.number||'Invoice')} · ${esc(i.date)}</small></div><b>${fmt(i.total)}</b></div>`).join(''):'<div class="empty">No invoices yet. Start with a new credit sale.</div>'}</div></article>
 </div><div class="dashboard-foot"><span><span class="footer-pulse"></span> ${statusText}</span><span>OrnaFlow preview · designed for everyday clarity</span></div>`;
}function inventory(){let arr=state.products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(search.toLowerCase()));return heading('Inventory','Manage ornaments and track available stock.',`<button class="btn" onclick="openStock()">+ Receive Stock</button> <button class="btn primary" onclick="openProduct()">+ Add Product</button>`)+`<div class="panel"><div class="toolbar"><input class="search" placeholder="Search products or SKU..." value="${esc(search)}" oninput="search=this.value;updateTable('inventory')"><span class="muted">${arr.length} products</span></div><div id="inventory-results">${inventoryTable(arr)}</div></div>`}function inventoryTable(arr){return `<div class="tablewrap"><table><thead><tr><th>Product</th><th>Category</th><th>Cost</th><th>Selling price</th><th>Stock</th><th></th></tr></thead><tbody>${arr.map(p=>`<tr><td><strong>${esc(p.name)}</strong><span class="muted">${esc(p.sku)}</span></td><td>${esc(p.category)}</td><td>${fmt(p.cost)}</td><td>${fmt(p.price)}</td><td><span class="chip ${p.stock<=20?'warn':''}">${p.stock} units</span></td><td><button class="smallbtn" onclick="openStock(${p.id})">Receive</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No products found</td></tr>'}</tbody></table></div>`}function updateTable(type){if(type==='inventory')document.getElementById('inventory-results').innerHTML=inventoryTable(state.products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(search.toLowerCase())));if(type==='customers')document.getElementById('customer-results').innerHTML=customerTable(state.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(search.toLowerCase())))}function openProduct(){modal(`<h2>Add product</h2><form onsubmit="event.preventDefault();addProduct(this)"><div class="grid2"><div class="field"><label>Product name</label><input name="name" required placeholder="e.g. Wooden Elephant"></div><div class="field"><label>Product code</label><input name="sku" required placeholder="ORN-006"></div><div class="field"><label>Category</label><input name="category" required placeholder="Wooden crafts"></div><div class="field"><label>Opening stock</label><input name="stock" type="number" min="0" step="1" required value="0"></div><div class="field"><label>Purchase cost (LKR)</label><input name="cost" type="number" min="0" step="0.01" required></div><div class="field"><label>Selling price (LKR)</label><input name="price" type="number" min="0" step="0.01" required></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save product</button></div></form>`)}function addProduct(f){const a=Object.fromEntries(new FormData(f));if(state.products.some(p=>p.sku.toLowerCase()===a.sku.trim().toLowerCase()))return toast('That product code already exists');const p={id:Date.now(),name:a.name.trim(),sku:a.sku.trim(),category:a.category.trim(),stock:+a.stock,price:+a.price,cost:+a.cost};state.products.push(p);if(p.stock)state.movements.push({id:Date.now(),productId:p.id,qty:p.stock,type:'Opening stock',date:today()});save();closeModal();render();toast('Product added')}function openStock(id){modal(`<h2>Receive stock</h2><form onsubmit="event.preventDefault();receiveStock(this)"><div class="field"><label>Product</label><select name="productId" required>${state.products.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.name)} (${p.stock} available)</option>`).join('')}</select></div><div class="field"><label>Quantity received</label><input name="qty" type="number" min="1" step="1" required></div><div class="field"><label>Notes / supplier reference (optional)</label><input name="note" placeholder="Purchase reference"></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Receive stock</button></div></form>`)}function receiveStock(f){const v=Object.fromEntries(new FormData(f)),p=state.products.find(p=>p.id===+v.productId),q=+v.qty;if(!p||!Number.isInteger(q)||q<1)return toast('Invalid quantity');p.stock+=q;state.movements.push({id:Date.now(),productId:p.id,qty:q,type:'Purchase receipt',date:today(),note:v.note});save();closeModal();render();toast('Stock updated')}function customers(){return heading('Customers','Customer records and credit balances.',`<button class="btn primary" onclick="openCustomer()">+ Add Customer</button>`)+`<div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">${metric('Active customers',state.customers.length,'All registered shops')}${metric('Total outstanding',fmt(totalDue()),'Invoice balance after payments')}</div><div class="panel"><div class="toolbar"><input class="search" placeholder="Search shops or phone..." value="${esc(search)}" oninput="search=this.value;updateTable('customers')"></div><div id="customer-results">${customerTable(state.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(search.toLowerCase())))}</div></div>`}function customerTable(arr){return `<div class="tablewrap"><table><thead><tr><th>Customer / shop</th><th>Phone</th><th>Credit terms</th><th>Outstanding</th><th></th></tr></thead><tbody>${arr.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone)}</td><td>${c.creditDays} days</td><td><strong>${fmt(due(c.id))}</strong></td><td><button class="smallbtn" onclick="openPayment(${c.id})">Receive payment</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No customers found</td></tr>'}</tbody></table></div>`}function openCustomer(){modal(`<h2>Add customer</h2><form onsubmit="event.preventDefault();addCustomer(this)"><div class="field"><label>Shop name</label><input name="name" required></div><div class="field"><label>Contact number</label><input name="phone"></div><div class="field"><label>Default credit period (days)</label><input name="creditDays" type="number" min="0" value="30" required></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save customer</button></div></form>`)}function addCustomer(f){let a=Object.fromEntries(new FormData(f));state.customers.push({id:Date.now(),name:a.name.trim(),phone:a.phone,creditDays:+a.creditDays});save();closeModal();render();toast('Customer added')}function sales(){
 return heading('New Sale','Record cash sales or credit sales with an upfront payment.',`<button class="btn" onclick="clearCart()">Clear Cart</button>`)+
 `<div class="sale-layout"><div class="panel"><div class="panelhead"><h2>Choose products</h2></div>
 <div class="field"><label>Search product</label><input placeholder="Search product name / SKU" id="saleSearch" oninput="filterSaleProducts(this.value)"></div>

 <div class="panel"><h2>Sale details</h2>

 <div class="field"><label id="salePaidLabel">${saleMode==='cash'?'Amount collected (LKR)':'Advance received now (LKR)'}</label>

 </div></div>`;
}
function refreshSalePaymentFields(){
 const label=document.getElementById('saleCustomerLabel'),select=document.getElementById('customerSelect'),paid=document.getElementById('salePaid');
 if(!paid)return;

function saleProductList(a){return a.map(p=>`<div class="item-row"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.sku)} · ${p.stock} in stock · ${fmt(p.price)}</div></div><button class="smallbtn" ${p.stock===0?'disabled':''} onclick="addCart(${p.id})">+ Add</button></div>`).join('')||'<div class="empty">No matching products</div>'}function filterSaleProducts(q){document.getElementById('saleProducts').innerHTML=saleProductList(state.products.filter(p=>(p.name+' '+p.sku).toLowerCase().includes(q.toLowerCase())))}function addCart(id){let p=state.products.find(p=>p.id===id),c=cart.find(x=>x.id===id);if(!p||((c?.qty||0)>=p.stock))return toast('Not enough stock');if(c)c.qty++;else cart.push({id,qty:1});refreshCart();toast('Added to cart')}function cartRows(){return cart.map(c=>{let p=state.products.find(p=>p.id===c.id);return `<div class="item-row"><div><strong>${esc(p.name)}</strong><div class="muted">${fmt(p.price)} × ${c.qty}</div></div><div style="display:flex;gap:5px;align-items:center"><input class="qty" type="number" min="0" max="${p.stock}" value="${c.qty}" onchange="changeQty(${c.id},this.value)"><button class="smallbtn" onclick="changeQty(${c.id},0)">×</button></div></div>`}).join('')||'<div class="empty" style="padding:16px">No products added yet</div>'}function cartTotal(){return cart.reduce((s,c)=>s+state.products.find(p=>p.id===c.id).price*c.qty,0)}function refreshCart(){if(page!=='sales')return;document.getElementById('cartRows').innerHTML=cartRows();document.getElementById('cartCount').textContent=cart.length+' products';document.getElementById('saleTotal').textContent=fmt(cartTotal());refreshSaleSummary()}function changeQty(id,val){const q=+val,p=state.products.find(p=>p.id===id);if(!Number.isInteger(q)||q<0||q>p.stock)return toast('Quantity exceeds available stock');if(q===0)cart=cart.filter(c=>c.id!==id);else cart.find(c=>c.id===id).qty=q;refreshCart()}function clearCart(){cart=[];refreshCart()}function postSale(){const id=+document.getElementById('customerSelect').value;selectedCustomer=String(id);if(!id)return toast('Select a customer');if(!cart.length)return toast('Add products to the cart');if(cart.some(c=>c.qty>state.products.find(p=>p.id===c.id).stock))return toast('Insufficient stock');const num='INV-'+String(Math.max(0,...state.invoices.map(i=>i.id))+1).padStart(4,'0'),invoice={id:Math.max(0,...state.invoices.map(i=>i.id))+1,number:num,customerId:id,date:today(),total:cartTotal(),status:'posted',items:cart.map(c=>({...c,price:state.products.find(p=>p.id===c.id).price}))};state.invoices.push(invoice);cart.forEach(c=>{let p=state.products.find(p=>p.id===c.id);p.stock-=c.qty;state.movements.push({id:Date.now()+Math.random(),productId:p.id,qty:-c.qty,type:'Sale',invoice:num,date:today()})});cart=[];save();render();toast(num+' saved as a local demo sale')}function payments(){

 <div class="panel"><div class="panelhead"><h2>Payment history</h2></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Type</th><th>Method</th><th>Amount</th><th>Notes</th></tr></thead>

function configureCloud(f){
 const v=Object.fromEntries(new FormData(f));
 let url;try{url=new URL(v.url)}catch{toast('Invalid project URL');return}
 if(url.protocol!=='https:'||!url.hostname.endsWith('.supabase.co')||url.pathname!=='/'||!v.key.trim()||v.key.toLowerCase().includes('service_role')||v.key.startsWith('sb_secret_')){toast('Enter a Supabase HTTPS project URL and PUBLIC key');return}
 cloudConfig={url:url.origin,key:v.key.trim()};localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(cloudConfig));
 cloudSession=null;localStorage.removeItem(CLOUD_SESSION_KEY);cloudReady=false;clearInterval(cloudTimer);render();toast('Connection saved. Sign in next.');
}
async function supaFetch(path,{method='GET',body,token}={}){
 if(!cloudConfig)throw Error('Configure your Supabase connection');
 const headers={'apikey':cloudConfig.key,'Content-Type':'application/json'};
 if(token)headers.Authorization='Bearer '+token;
 const response=await fetch(cloudConfig.url+path,{method,headers,...(body===undefined?{}:{body:JSON.stringify(body)})});
 let data;try{data=await response.json()}catch{data=null}
 if(!response.ok)throw Error(data?.msg||data?.error_description||data?.message||data?.error||'Cloud request failed ('+response.status+')');
 return data;
}
async function refreshSession(){
 if(!cloudSession)throw Error('Not signed in');
 if(Date.now() < cloudSession.expires_at*1000-90000)return;
 if(!cloudSession.refresh_token)throw Error('Session expired; sign in again');
 const t=await supaFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:cloudSession.refresh_token}});
 setSession(t);
}
function setSession(s){cloudSession={...s,expires_at:Math.floor(Date.now()/1000)+s.expires_in};localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(cloudSession));}
async function cloudRPC(name,args={}){await refreshSession();return supaFetch('/rest/v1/rpc/'+name,{method:'POST',token:cloudSession.access_token,body:args})}
async function cloudLogin(f){
 let a=Object.fromEntries(new FormData(f));const action=document.activeElement?.value==='signup'?'signup':'login';
 try{
  const path=action==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
  const session=await supaFetch(path,{method:'POST',body:{email:a.email,password:a.password}});
  if(!session.access_token){toast('Check your email, confirm your account, then sign in');return}
  setSession(session);render();await cloudLoad();
 }catch(e){toast(e.message)}
}
async function changeCloudPassword(form){
 const status=document.getElementById('change-cloud-password-status');
 const button=document.getElementById('change-cloud-password-button');
 if(!cloudSession?.access_token || !cloudConfig){toast('Sign in to Cloud Mode first');return}
 const current=form.elements.current_password.value;
 const next=form.elements.new_password.value;
 const confirm=form.elements.confirm_password.value;
 if(next.length<12){status.textContent='New password must have at least 12 characters.';return}
 if(next!==confirm){status.textContent='New passwords do not match.';return}
 if(next===current){status.textContent='Choose a password different from your current password.';return}
 const email=cloudSession.user?.email;
 if(!email){status.textContent='Account email unavailable. Sign out and back in, then retry.';return}
 button.disabled=true;
 status.textContent='Checking your current password…';
 try{
   // Validate the current password against Supabase Auth, not local browser state.
   const verified=await supaFetch('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password:current}});
   if(!verified.access_token)throw Error('Could not verify the current password');
   status.textContent='Updating your password…';
   await supaFetch('/auth/v1/user',{method:'PUT',token:verified.access_token,body:{password:next,current_password:current}});
   // Preserve the fresh authenticated session, never any plaintext password.
   setSession(verified);
   form.reset();
   status.textContent='Password changed successfully. Use the new password next time you sign in.';
   toast('Password updated successfully');
 }catch(error){
   status.textContent=error.message || 'Password change failed. Please try again.';
 }finally{
   button.disabled=false;
 }
}
